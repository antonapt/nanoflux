[project]
name = "nanoflux"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nanoflux = "nanoflux.main:run"

[build-system]  
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package]
name = "nanoflux"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.dependencies]
rich = ">=14.2.0"
rich-argparse = ">=1.7.2"
joblib = ">=1.5.2"
numpy = ">=2.2.6"
pandas = ">=2.3.2"
scikit-learn = ">=1.7.1"
samtools = ">=1.25,<2"
bedtools = ">=2.31.1,<3"
minimap2 = ">=2.31,<3"
ont-modkit = ">=0.6.4,<0.7"
requests = ">=2.34.2,<3"

[tool.pixi.pypi-dependencies]
nanoflux = { path = ".", editable = true }
pathtype = "*"
liblinear-official = "*"

[tool.pixi.package.host-dependencies]  
hatchling = ">=1.26.3"

[tool.pixi.package.run-dependencies]  
rich = ">=14.2.0"
rich-argparse = ">=1.7.2"
joblib = ">=1.5.2"
numpy = ">=2.2.6"
pandas = ">=2.3.2"
scikit-learn = ">=1.7.1"
samtools = ">=1.25,<2"
bedtools = ">=2.31.1,<3"
minimap2 = ">=2.31,<3"
ont-modkit = ">=0.6.4,<0.7"
requests = ">=2.34.2,<3"

